name: Galactic Navigation browser smoke
on:
  push:
    branches: [feature/interstellar-travel-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-galactic-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: node scripts/smoke-galactic-browser.mjs
      - name: Upload Galactic Navigation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: galactic-navigation-screenshots
          path: test-artifacts/galactic-*.png
          if-no-files-found: ignore
          retention-days: 14
