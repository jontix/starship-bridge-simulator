name: Interstellar visual roundtrip
on:
  push:
    branches: [feature/interstellar-travel-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-interstellar-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: node scripts/smoke-interstellar-visual-browser.mjs
      - name: Upload interstellar destination screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interstellar-visual-roundtrip-screenshots
          path: test-artifacts/jump-visual-*.png
          if-no-files-found: ignore
          retention-days: 14
