name: Flight model checks
on:
  push:
    branches: [main, feature/interstellar-travel-v1, feature/helm-station-v2, feature/flight-model-v1, feature/navigation-visuals, feature/first-star-system, feature/interplanetary-cruise, feature/planetary-rendering, feature/planetary-rendering-v2, feature/procedural-planet-generator-v1, feature/planetary-surface-detail-lod-v1]
  pull_request:
    branches: [main, feature/flight-model-v1, feature/navigation-visuals, feature/first-star-system, feature/interplanetary-cruise, feature/planetary-rendering]
# Rapid visual iteration should not leave dozens of obsolete GPU builds queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: node --import tsx --test packages/client/src/planetAppearance.test.ts
      - run: node --import tsx --test packages/client/src/planetView.test.ts
      - run: node --import tsx --test packages/client/src/surfaceDetail.test.ts
      - run: node --import tsx --test packages/client/src/helmInstruments.test.ts
      - run: node scripts/smoke-server.mjs
      - run: node scripts/smoke-universe.mjs
      - run: node scripts/smoke-universe.mjs vesper
      - run: node scripts/smoke-cruise.mjs
      - run: node scripts/smoke-interstellar.mjs
