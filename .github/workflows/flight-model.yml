name: Flight model checks
on:
  push:
    branches: [main, feature/flight-model-v1, feature/navigation-visuals, feature/first-star-system, feature/interplanetary-cruise]
  pull_request:
    branches: [main, feature/flight-model-v1, feature/navigation-visuals, feature/first-star-system]
jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: windows-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: node scripts/smoke-server.mjs
      - run: node scripts/smoke-universe.mjs
      - run: node scripts/smoke-cruise.mjs
